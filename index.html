<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가계부</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, #e0f7fa 0%, #fff9e6 60%, #ffe0b2 100%);
      color: #1a3a4a;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #0ea5e9 0%, #06b6d4 50%, #22d3ee 100%);
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(6,182,212,0.3);
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊🌊';
      position: absolute;
      bottom: -6px;
      left: 0;
      font-size: 1.1rem;
      letter-spacing: -4px;
      opacity: 0.35;
      white-space: nowrap;
    }

    header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }

    .container { max-width: 760px; margin: 0 auto; padding: 24px 16px; }

    /* 요약 카드 */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .card {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 12px rgba(6,182,212,0.1);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.6);
    }

    .card .label { font-size: 0.78rem; color: #6b9aaa; margin-bottom: 6px; font-weight: 500; }
    .card .amount { font-size: 1.3rem; font-weight: 700; }
    .card.income .amount  { color: #059669; }
    .card.expense .amount { color: #f97316; }
    .card.balance .amount { color: #0ea5e9; }

    /* 입력 폼 */
    .form-box {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(6,182,212,0.1);
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.6);
    }

    .form-box h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: #0e7490; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .form-row.three { grid-template-columns: 1fr 1fr 1fr; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #bae6fd;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f0faff;
      color: #1a3a4a;
    }

    input:focus, select:focus {
      border-color: #06b6d4;
      background: white;
      box-shadow: 0 0 0 3px rgba(6,182,212,0.12);
    }

    .btn-add {
      width: 100%;
      padding: 11px;
      background: linear-gradient(90deg, #f97316, #fb923c);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .btn-add:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-add:active { transform: translateY(0); }
    .btn-add:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* 거래 목록 */
    .list-box {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(6,182,212,0.1);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.6);
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #e0f2fe;
    }

    .list-header h2 { font-size: 0.95rem; font-weight: 600; color: #0e7490; }

    .filter-row {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid #e0f2fe;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid #bae6fd;
      background: white;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
      color: #0ea5e9;
      font-weight: 500;
    }

    .filter-btn.active {
      background: linear-gradient(90deg, #0ea5e9, #06b6d4);
      border-color: transparent;
      color: white;
    }

    .transaction-list { list-style: none; }

    .transaction-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #f0fafb;
      gap: 14px;
      transition: background 0.15s;
    }

    .transaction-item:last-child { border-bottom: none; }
    .transaction-item:hover { background: #f0faff; }

    .tx-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }

    .tx-icon.income  { background: #ccfbf1; }
    .tx-icon.expense { background: #ffedd5; }

    .tx-info { flex: 1; min-width: 0; }
    .tx-desc { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-meta { font-size: 0.76rem; color: #94b8c4; margin-top: 2px; }

    .tx-amount { font-size: 0.95rem; font-weight: 700; flex-shrink: 0; }
    .tx-amount.income  { color: #059669; }
    .tx-amount.expense { color: #f97316; }

    .btn-del {
      background: none; border: none; cursor: pointer;
      color: #c9e6ef; font-size: 1rem; padding: 4px;
      transition: color 0.15s;
    }
    .btn-del:hover { color: #f97316; }

    .empty {
      text-align: center; padding: 40px 20px;
      color: #a0c4d0; font-size: 0.9rem;
    }

    /* 차트 섹션 */
    .chart-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .chart-box {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(6,182,212,0.1);
      border: 1px solid rgba(255,255,255,0.6);
    }

    .chart-box h3 {
      font-size: 0.88rem;
      font-weight: 600;
      color: #0e7490;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chart-wrap {
      position: relative;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chart-empty {
      font-size: 0.82rem;
      color: #a0c4d0;
      text-align: center;
    }

    .chart-legend {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #4a7a8a;
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-pct {
      font-size: 0.75rem;
      color: #94b8c4;
      margin-left: 4px;
    }

    @media (max-width: 500px) {
      .chart-section { grid-template-columns: 1fr; }
    }

    @media (max-width: 500px) {
      .summary { grid-template-columns: repeat(3, 1fr); }
      .card .amount { font-size: 1rem; }
      .form-row { grid-template-columns: 1fr; }
      .form-row.three { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.5rem;">☀️</span>
  <h1>여름 가계부</h1>
</header>

<div class="container">
  <!-- 요약 -->
  <div class="summary">
    <div class="card income">
      <div class="label">총 수입</div>
      <div class="amount" id="totalIncome">₩0</div>
    </div>
    <div class="card expense">
      <div class="label">총 지출</div>
      <div class="amount" id="totalExpense">₩0</div>
    </div>
    <div class="card balance">
      <div class="label">잔액</div>
      <div class="amount" id="balance">₩0</div>
    </div>
  </div>

  <!-- 차트 -->
  <div class="chart-section">
    <div class="chart-box">
      <h3>💰 수입 카테고리</h3>
      <div class="chart-wrap">
        <canvas id="incomeChart"></canvas>
        <div class="chart-empty" id="incomeEmpty" style="display:none;">데이터 없음</div>
      </div>
      <div class="chart-legend" id="incomeLegend"></div>
    </div>
    <div class="chart-box">
      <h3>💸 지출 카테고리</h3>
      <div class="chart-wrap">
        <canvas id="expenseChart"></canvas>
        <div class="chart-empty" id="expenseEmpty" style="display:none;">데이터 없음</div>
      </div>
      <div class="chart-legend" id="expenseLegend"></div>
    </div>
  </div>

  <!-- 입력 폼 -->
  <div class="form-box">
    <h2>내역 추가</h2>
    <div class="form-row">
      <select id="type">
        <option value="income">💰 수입</option>
        <option value="expense">💸 지출</option>
      </select>
      <select id="category">
        <option value="급여">급여</option>
        <option value="용돈">용돈</option>
        <option value="부업">부업</option>
        <option value="식비">식비</option>
        <option value="교통">교통</option>
        <option value="쇼핑">쇼핑</option>
        <option value="의료">의료</option>
        <option value="문화">문화</option>
        <option value="주거">주거</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="form-row three">
      <input type="text" id="desc" placeholder="내용 (예: 점심식사)" />
      <input type="number" id="amount" placeholder="금액 (원)" min="0" />
      <input type="date" id="date" />
    </div>
    <button class="btn-add" onclick="addTransaction()">추가하기</button>
  </div>

  <!-- 거래 목록 -->
  <div class="list-box">
    <div class="list-header">
      <h2>거래 내역</h2>
      <span id="txCount" style="font-size:0.8rem;color:#aaa;"></span>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
      <button class="filter-btn" onclick="setFilter('income', this)">수입</button>
      <button class="filter-btn" onclick="setFilter('expense', this)">지출</button>
    </div>
    <ul class="transaction-list" id="txList"></ul>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://elzgeodwiruoxeotadyx.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsemdlb2R3aXJ1b3hlb3RhZHl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0Nzk1MDAsImV4cCI6MjA5NzA1NTUwMH0.f1ZvpU4pi4a5wB_lI6V7kSW730rayv-L09Elj20qSOc';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CATEGORY_ICONS = {
    급여:'💼', 용돈:'🎁', 부업:'🛠️',
    식비:'🍽️', 교통:'🚌', 쇼핑:'🛍️',
    의료:'💊', 문화:'🎬', 주거:'🏠', 기타:'📌'
  };

  const INCOME_COLORS  = ['#34d399','#2dd4bf','#06b6d4','#0ea5e9','#38bdf8'];
  const EXPENSE_COLORS = ['#fb923c','#f97316','#fbbf24','#f59e0b','#fb7185','#f43f5e','#fda4af'];

  let transactions = [];
  let currentFilter = 'all';
  let incomeChartInst = null;
  let expenseChartInst = null;

  document.getElementById('date').valueAsDate = new Date();

  document.getElementById('type').addEventListener('change', function() {
    const cat = document.getElementById('category');
    if (this.value === 'income') {
      cat.innerHTML = `
        <option value="급여">급여</option>
        <option value="용돈">용돈</option>
        <option value="부업">부업</option>
        <option value="기타">기타</option>`;
    } else {
      cat.innerHTML = `
        <option value="식비">식비</option>
        <option value="교통">교통</option>
        <option value="쇼핑">쇼핑</option>
        <option value="의료">의료</option>
        <option value="문화">문화</option>
        <option value="주거">주거</option>
        <option value="기타">기타</option>`;
    }
  });

  function fmt(n) {
    return '₩' + n.toLocaleString('ko-KR');
  }

  function setLoading(on) {
    document.querySelector('.btn-add').disabled = on;
    document.querySelector('.btn-add').textContent = on ? '저장 중...' : '추가하기';
  }

  async function loadTransactions() {
    const { data, error } = await db
      .from('transactions')
      .select('*')
      .order('date', { ascending: false })
      .order('created_at', { ascending: false });

    if (error) { console.error('불러오기 실패:', error.message); return; }
    transactions = data.map(t => ({ ...t, desc: t.description }));
    render();
  }

  async function addTransaction() {
    const type     = document.getElementById('type').value;
    const category = document.getElementById('category').value;
    const desc     = document.getElementById('desc').value.trim();
    const amount   = parseInt(document.getElementById('amount').value);
    const date     = document.getElementById('date').value;

    if (!desc)   { alert('내용을 입력해주세요.'); return; }
    if (!amount || amount <= 0) { alert('금액을 올바르게 입력해주세요.'); return; }
    if (!date)   { alert('날짜를 선택해주세요.'); return; }

    setLoading(true);
    const { error } = await db
      .from('transactions')
      .insert({ type, category, description: desc, amount, date });
    setLoading(false);

    if (error) { alert('저장 실패: ' + error.message); return; }

    document.getElementById('desc').value = '';
    document.getElementById('amount').value = '';
    document.getElementById('date').valueAsDate = new Date();

    await loadTransactions();
  }

  async function deleteTransaction(id) {
    const { error } = await db
      .from('transactions')
      .delete()
      .eq('id', id);

    if (error) { alert('삭제 실패: ' + error.message); return; }
    await loadTransactions();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function buildChartData(type) {
    const map = {};
    transactions.filter(t => t.type === type).forEach(t => {
      map[t.category] = (map[t.category] || 0) + t.amount;
    });
    const labels = Object.keys(map);
    const data   = Object.values(map);
    return { labels, data, total: data.reduce((s, v) => s + v, 0) };
  }

  function renderCharts() {
    ['income', 'expense'].forEach(type => {
      const { labels, data, total } = buildChartData(type);
      const canvas  = document.getElementById(type + 'Chart');
      const empty   = document.getElementById(type + 'Empty');
      const legend  = document.getElementById(type + 'Legend');
      const colors  = type === 'income' ? INCOME_COLORS : EXPENSE_COLORS;
      const inst    = type === 'income' ? incomeChartInst : expenseChartInst;

      if (inst) inst.destroy();

      if (total === 0) {
        canvas.style.display = 'none';
        empty.style.display  = 'block';
        legend.innerHTML = '';
        return;
      }

      canvas.style.display = 'block';
      empty.style.display  = 'none';

      const chart = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: labels.map((_, i) => colors[i % colors.length]),
            borderWidth: 2,
            borderColor: '#fff',
            hoverOffset: 6
          }]
        },
        options: {
          cutout: '62%',
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ` ${ctx.label}: ₩${ctx.raw.toLocaleString('ko-KR')}`
              }
            }
          }
        }
      });

      if (type === 'income') incomeChartInst = chart;
      else expenseChartInst = chart;

      legend.innerHTML = labels.map((label, i) => {
        const pct = Math.round(data[i] / total * 100);
        return `
          <div class="legend-item">
            <div class="legend-left">
              <div class="legend-dot" style="background:${colors[i % colors.length]}"></div>
              <span>${CATEGORY_ICONS[label] || ''} ${label}</span>
            </div>
            <span>₩${data[i].toLocaleString('ko-KR')}<span class="legend-pct">${pct}%</span></span>
          </div>`;
      }).join('');
    });
  }

  function render() {
    const filtered = currentFilter === 'all'
      ? transactions
      : transactions.filter(t => t.type === currentFilter);

    const totalIncome  = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const balance      = totalIncome - totalExpense;

    document.getElementById('totalIncome').textContent  = fmt(totalIncome);
    document.getElementById('totalExpense').textContent = fmt(totalExpense);
    document.getElementById('balance').textContent      = fmt(balance);
    document.getElementById('balance').style.color      = balance < 0 ? '#dc2626' : '#4f46e5';
    document.getElementById('txCount').textContent      = `총 ${filtered.length}건`;

    renderCharts();

    const list = document.getElementById('txList');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">내역이 없습니다.</div>';
      return;
    }

    list.innerHTML = filtered.map(t => {
      const icon = CATEGORY_ICONS[t.category] || '📌';
      const sign = t.type === 'income' ? '+' : '-';
      return `
        <li class="transaction-item">
          <div class="tx-icon ${t.type}">${icon}</div>
          <div class="tx-info">
            <div class="tx-desc">${t.desc}</div>
            <div class="tx-meta">${t.date} · ${t.category}</div>
          </div>
          <div class="tx-amount ${t.type}">${sign}${fmt(t.amount)}</div>
          <button class="btn-del" onclick="deleteTransaction(${t.id})" title="삭제">✕</button>
        </li>`;
    }).join('');
  }

  loadTransactions();
</script>
</body>
</html>
